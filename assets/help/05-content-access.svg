<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Membexa content restriction</title>
  <desc id="desc">Annotated visual showing the Membexa Access panel in the WordPress editor and how to restrict content by membership plan.</desc>
  <rect width="1200" height="650" fill="#f6f7f7"/>
  <text x="55" y="68" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1d2327">Protect content / কনটেন্ট লক করুন</text>
  <text x="55" y="103" font-family="Arial, sans-serif" font-size="18" fill="#50575e">Edit a post/page and use the Membexa Access panel.</text>

  <rect x="70" y="145" width="1060" height="420" rx="16" fill="#fff" stroke="#c3c4c7" stroke-width="2"/>
  <text x="105" y="193" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1d2327">Membexa Access</text>
  <line x1="105" y1="215" x2="1095" y2="215" stroke="#dcdcde"/>

  <g font-family="Arial, sans-serif">
    <circle cx="135" cy="270" r="23" fill="#2271b1"/><text x="129" y="278" font-size="19" font-weight="700" fill="#fff">1</text>
    <rect x="185" y="249" width="22" height="22" rx="3" fill="#fff" stroke="#8c8f94" stroke-width="2"/>
    <path d="M190 260 l6 6 l12 -15" fill="none" stroke="#2271b1" stroke-width="3"/>
    <text x="225" y="268" font-size="19" font-weight="700" fill="#1d2327">Restrict this content / এই কনটেন্ট সীমাবদ্ধ করুন</text>

    <circle cx="135" cy="345" r="23" fill="#2271b1"/><text x="129" y="353" font-size="19" font-weight="700" fill="#fff">2</text>
    <text x="185" y="335" font-size="18" font-weight="700" fill="#1d2327">Allowed plans / অনুমোদিত প্ল্যান</text>
    <rect x="185" y="360" width="22" height="22" rx="3" fill="#fff" stroke="#8c8f94" stroke-width="2"/>
    <path d="M190 371 l6 6 l12 -15" fill="none" stroke="#2271b1" stroke-width="3"/>
    <text x="225" y="378" font-size="18" fill="#50575e">Gold Membership</text>
    <rect x="470" y="360" width="22" height="22" rx="3" fill="#fff" stroke="#8c8f94" stroke-width="2"/>
    <text x="510" y="378" font-size="18" fill="#50575e">Silver Membership</text>

    <circle cx="135" cy="455" r="23" fill="#2271b1"/><text x="129" y="463" font-size="19" font-weight="700" fill="#fff">3</text>
    <text x="185" y="451" font-size="18" font-weight="700" fill="#1d2327">Update / Publish the post</text>
    <text x="185" y="480" font-size="16" fill="#50575e">Visitors without an eligible active membership see your Restricted Content Message.</text>
    <text x="185" y="508" font-size="16" fill="#135e96">বাংলা: প্ল্যান সিলেক্ট করে পোস্ট Update/Publish করুন। যোগ্য সদস্য ছাড়া অন্যরা access message দেখবে।</text>
  </g>

  <rect x="125" y="585" width="950" height="42" rx="8" fill="#f0f6fc"/>
  <text x="150" y="612" font-family="Arial, sans-serif" font-size="16" fill="#135e96">Tip: Test once as a logged-out visitor and once as a paid/active member.</text>
</svg>