<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Membexa admin map</title>
  <desc id="desc">Annotated visual showing the Membexa WordPress admin menu and recommended setup order.</desc>
  <rect width="1200" height="650" fill="#f6f7f7"/>
  <rect x="35" y="35" width="1130" height="580" rx="18" fill="#fff" stroke="#c3c4c7" stroke-width="2"/>
  <rect x="35" y="35" width="250" height="580" rx="18" fill="#1d2327"/>
  <text x="72" y="92" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">WordPress</text>
  <text x="72" y="150" font-family="Arial, sans-serif" font-size="20" fill="#c3c4c7">Dashboard</text>
  <rect x="55" y="178" width="210" height="52" rx="8" fill="#2271b1"/>
  <text x="75" y="211" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">Membexa</text>
  <text x="78" y="266" font-family="Arial, sans-serif" font-size="18" fill="#fff">Dashboard</text>
  <text x="78" y="304" font-family="Arial, sans-serif" font-size="18" fill="#fff">Plans</text>
  <text x="78" y="342" font-family="Arial, sans-serif" font-size="18" fill="#fff">Subscriptions</text>
  <text x="78" y="380" font-family="Arial, sans-serif" font-size="18" fill="#fff">Members</text>
  <text x="78" y="418" font-family="Arial, sans-serif" font-size="18" fill="#fff">Settings</text>
  <rect x="64" y="438" width="190" height="44" rx="7" fill="#72aee6"/>
  <text x="78" y="467" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#102a43">Help &amp; Setup</text>

  <text x="335" y="95" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1d2327">Recommended setup order / সেটআপের সঠিক ক্রম</text>
  <text x="335" y="132" font-family="Arial, sans-serif" font-size="18" fill="#50575e">Follow the numbers from 1 to 5. / ১ থেকে ৫ পর্যন্ত ধাপে ধাপে করুন।</text>

  <g font-family="Arial, sans-serif">
    <circle cx="365" cy="205" r="28" fill="#2271b1"/><text x="357" y="214" font-size="24" font-weight="700" fill="#fff">1</text>
    <text x="410" y="200" font-size="23" font-weight="700" fill="#1d2327">Create pages / পেজ তৈরি</text>
    <text x="410" y="228" font-size="17" fill="#50575e">Pricing, Join/Register, Account</text>

    <circle cx="365" cy="295" r="28" fill="#2271b1"/><text x="357" y="304" font-size="24" font-weight="700" fill="#fff">2</text>
    <text x="410" y="290" font-size="23" font-weight="700" fill="#1d2327">Create plans / প্ল্যান তৈরি</text>
    <text x="410" y="318" font-size="17" fill="#50575e">Price, currency, billing, gateway IDs</text>

    <circle cx="365" cy="385" r="28" fill="#2271b1"/><text x="357" y="394" font-size="24" font-weight="700" fill="#fff">3</text>
    <text x="410" y="380" font-size="23" font-weight="700" fill="#1d2327">Configure payments / পেমেন্ট সেটআপ</text>
    <text x="410" y="408" font-size="17" fill="#50575e">Stripe, PayPal, and/or bKash</text>

    <circle cx="790" cy="205" r="28" fill="#2271b1"/><text x="782" y="214" font-size="24" font-weight="700" fill="#fff">4</text>
    <text x="835" y="200" font-size="23" font-weight="700" fill="#1d2327">Protect content / কনটেন্ট লক</text>
    <text x="835" y="228" font-size="17" fill="#50575e">Choose eligible plans in the editor</text>

    <circle cx="790" cy="295" r="28" fill="#2271b1"/><text x="782" y="304" font-size="24" font-weight="700" fill="#fff">5</text>
    <text x="835" y="290" font-size="23" font-weight="700" fill="#1d2327">Test checkout / টেস্ট করুন</text>
    <text x="835" y="318" font-size="17" fill="#50575e">Use sandbox/test credentials before live mode</text>
  </g>

  <rect x="335" y="470" width="785" height="92" rx="12" fill="#f0f6fc" stroke="#72aee6"/>
  <text x="365" y="510" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#135e96">Tip / টিপস</text>
  <text x="365" y="540" font-family="Arial, sans-serif" font-size="17" fill="#1d2327">Do not switch to live payment mode until one full sandbox/test checkout succeeds.</text>
  <text x="365" y="564" font-family="Arial, sans-serif" font-size="17" fill="#1d2327">একটি সম্পূর্ণ sandbox/test payment সফল না হওয়া পর্যন্ত live mode চালু করবেন না।</text>
</svg>