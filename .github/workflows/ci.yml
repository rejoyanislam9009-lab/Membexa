name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer phpcs

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare WordPress.org-style plugin directory
        run: |
          mkdir -p build/membexa
          rsync -a ./ build/membexa/ --exclude-from='.distignore'
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: './build/membexa'
          slug: 'membexa'
          ignore-warnings: true

  addon-plugin-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - slug: membexa-stripe
            source: addons/membexa-stripe
          - slug: membexa-paypal
            source: addons/membexa-paypal
          - slug: membexa-bkash
            source: addons/membexa-bkash
    steps:
      - uses: actions/checkout@v4
      - name: Prepare add-on directory
        run: |
          mkdir -p "build/${{ matrix.slug }}"
          rsync -a "${{ matrix.source }}/" "build/${{ matrix.slug }}/"
      - name: Run WordPress Plugin Check for add-on
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: './build/${{ matrix.slug }}'
          slug: '${{ matrix.slug }}'
          ignore-warnings: true

  woocommerce-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install wp-env
        run: npm install -g @wordpress/env
      - name: Start WordPress and activate WooCommerce
        run: |
          PLUGIN_DIR="$(pwd)"
          printf '{"core":null,"port":8890,"testsEnvironment":false,"mappings":{"wp-content/plugins/membexa":"%s","wp-content/plugins/membexa-stripe":"%s/addons/membexa-stripe","wp-content/plugins/membexa-paypal":"%s/addons/membexa-paypal","wp-content/plugins/membexa-bkash":"%s/addons/membexa-bkash"}}\n' "$PLUGIN_DIR" "$PLUGIN_DIR" "$PLUGIN_DIR" "$PLUGIN_DIR" > .wp-env.json
          wp-env start --update
          wp-env run cli wp plugin install woocommerce --activate
          wp-env run cli wp plugin activate membexa
      - name: Confirm core contains and loads no gateway implementation
        run: |
          wp-env run cli wp eval 'foreach ( array( "Stripe" => "class-stripe.php", "PayPal" => "class-paypal.php", "PayPal_Connection" => "class-paypal-connection.php", "Bkash" => "class-bkash.php" ) as $class => $file ) { $fqcn = "\\Membexa\\" . $class; if ( class_exists( $fqcn, false ) || file_exists( MEMBEXA_DIR . "includes/" . $file ) ) { fwrite( STDERR, "Core unexpectedly contains or loaded gateway implementation: {$class}\n" ); exit( 1 ); } } if ( \Membexa\Gateways::all() ) { fwrite( STDERR, "Core unexpectedly registered a payment gateway.\n" ); exit( 1 ); } echo "Membexa Core gateway isolation passed.\n";'
      - name: Activate modular payment add-ons
        run: wp-env run cli wp plugin activate membexa-stripe membexa-paypal membexa-bkash
      - name: Run modular payment add-on smoke test
        run: wp-env run cli wp eval-file wp-content/plugins/membexa/.github/tests/payment-addons-smoke.php
      - name: Run automatic page setup smoke test
        run: wp-env run cli wp eval-file wp-content/plugins/membexa/.github/tests/setup-smoke.php
      - name: Run PayPal connection smoke tests
        run: wp-env run cli wp eval-file wp-content/plugins/membexa/.github/tests/paypal-connection-smoke.php
      - name: Run WooCommerce membership smoke test
        run: wp-env run cli wp eval-file wp-content/plugins/membexa/.github/tests/woocommerce-smoke.php

  package:
    runs-on: ubuntu-latest
    needs: [quality, plugin-check, addon-plugin-check, woocommerce-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Build installable ZIPs
        run: |
          mkdir -p build/membexa
          rsync -a ./ build/membexa/ --exclude-from='.distignore'
          mkdir -p build/membexa-stripe build/membexa-paypal build/membexa-bkash
          rsync -a addons/membexa-stripe/ build/membexa-stripe/
          rsync -a addons/membexa-paypal/ build/membexa-paypal/
          rsync -a addons/membexa-bkash/ build/membexa-bkash/
          cd build
          zip -r membexa-1.5.0.zip membexa
          zip -r membexa-stripe-1.0.0.zip membexa-stripe
          zip -r membexa-paypal-1.0.0.zip membexa-paypal
          zip -r membexa-bkash-1.0.0.zip membexa-bkash
      - name: Upload Membexa Core
        uses: actions/upload-artifact@v4
        with:
          name: membexa-1.5.0
          path: build/membexa-1.5.0.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload Stripe add-on
        uses: actions/upload-artifact@v4
        with:
          name: membexa-stripe-1.0.0
          path: build/membexa-stripe-1.0.0.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload PayPal add-on
        uses: actions/upload-artifact@v4
        with:
          name: membexa-paypal-1.0.0
          path: build/membexa-paypal-1.0.0.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload bKash add-on
        uses: actions/upload-artifact@v4
        with:
          name: membexa-bkash-1.0.0
          path: build/membexa-bkash-1.0.0.zip
          if-no-files-found: error
          compression-level: 0
