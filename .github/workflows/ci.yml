name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer phpcs

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare WordPress.org-style plugin directory
        run: |
          mkdir -p build/membexa
          rsync -a ./ build/membexa/ --exclude-from='.distignore'
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: './build/membexa'
          slug: 'membexa'
          ignore-warnings: true

  woocommerce-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install wp-env
        run: npm install -g @wordpress/env
      - name: Start WordPress and activate WooCommerce
        run: |
          PLUGIN_DIR="$(pwd)"
          printf '{"core":null,"port":8890,"testsEnvironment":false,"mappings":{"wp-content/plugins/membexa":"%s"}}\n' "$PLUGIN_DIR" > .wp-env.json
          wp-env start --update
          wp-env run cli wp plugin install woocommerce --activate
          wp-env run cli wp plugin activate membexa
      - name: Run automatic page setup smoke test
        run: wp-env run cli wp eval-file wp-content/plugins/membexa/.github/tests/setup-smoke.php
      - name: Run PayPal connection smoke tests
        run: wp-env run cli wp eval-file wp-content/plugins/membexa/.github/tests/paypal-connection-smoke.php
      - name: Run WooCommerce membership smoke test
        run: wp-env run cli wp eval-file wp-content/plugins/membexa/.github/tests/woocommerce-smoke.php

  package:
    runs-on: ubuntu-latest
    needs: [quality, plugin-check, woocommerce-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Build installable plugin ZIP
        run: |
          mkdir -p build/membexa
          rsync -a ./ build/membexa/ --exclude-from='.distignore'
          cd build
          zip -r membexa-1.4.3.zip membexa
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: membexa-1.4.3
          path: build/membexa-1.4.3.zip
          if-no-files-found: error
          compression-level: 0
